<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Lost & Found</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #4f46e5;
  --primary-light: #818cf8;
  --primary-bg: #eef2ff;
  --success: #059669;
  --success-bg: #ecfdf5;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --danger: #dc2626;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-500: #6b7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --radius: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-lg);
}

.header-inner {
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,.2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.header-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
  opacity: .9;
}

.header-stats span { display: flex; align-items: center; gap: 4px; }

nav {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 20px 12px;
  display: flex;
  gap: 6px;
}

nav button {
  padding: 6px 16px;
  border: none;
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.8);
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  transition: all .2s;
}

nav button:hover { background: rgba(255,255,255,.25); color: white; }
nav button.active { background: white; color: var(--primary); font-weight: 600; }

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search-bar input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--gray-200);
  border-radius: var(--radius);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}

.search-bar input:focus { border-color: var(--primary-light); }

.filter-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-tag {
  padding: 6px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: 20px;
  background: white;
  cursor: pointer;
  font-size: 13px;
  color: var(--gray-700);
  transition: all .2s;
}

.filter-tag:hover { border-color: var(--primary-light); color: var(--primary); }
.filter-tag.active { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); font-weight: 500; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
  cursor: pointer;
}

.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

.card-image {
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray-300);
  font-size: 48px;
}

.card-image img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-body { padding: 16px; }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.card-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--gray-900);
}

.card-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-lost { background: #fef2f2; color: #dc2626; }
.badge-found { background: var(--success-bg); color: var(--success); }

.card-info {
  font-size: 13px;
  color: var(--gray-500);
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.card-info span { display: flex; align-items: center; gap: 6px; }

.card-category {
  display: inline-block;
  padding: 2px 10px;
  background: var(--gray-100);
  border-radius: 10px;
  font-size: 12px;
  color: var(--gray-700);
}

.card-contact {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--gray-100);
  font-size: 13px;
  color: var(--primary);
  font-weight: 500;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray-500);
}

.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--gray-700); }

.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(79,70,229,.4);
  transition: transform .2s, box-shadow .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.fab:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(79,70,229,.5); }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .2s;
}

.modal-overlay.show { display: flex; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .3s;
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--gray-100);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 { font-size: 20px; }

.modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: var(--gray-100);
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray-500);
}

.modal-close:hover { background: var(--gray-200); }

.modal-body { padding: 24px; }

.form-group { margin-bottom: 18px; }

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray-700);
}

.form-group label .required { color: var(--danger); }

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
  font-family: inherit;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--primary-light);
}

.form-group textarea { resize: vertical; min-height: 80px; }

.type-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.type-btn {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--gray-200);
  border-radius: 10px;
  background: white;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  font-size: 14px;
}

.type-btn:hover { border-color: var(--gray-300); }
.type-btn.active-lost { border-color: var(--danger); background: #fef2f2; color: var(--danger); font-weight: 600; }
.type-btn.active-found { border-color: var(--success); background: var(--success-bg); color: var(--success); font-weight: 600; }

.image-upload {
  border: 2px dashed var(--gray-200);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}

.image-upload:hover { border-color: var(--primary-light); background: var(--primary-bg); }

.image-upload .icon { font-size: 32px; color: var(--gray-300); }
.image-upload p { font-size: 13px; color: var(--gray-500); margin-top: 6px; }
.image-upload input { display: none; }

.image-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 8px;
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
}

.btn-submit:hover { opacity: .9; }

.detail-modal .modal { max-width: 560px; }

.detail-image {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
}

.detail-body { padding: 24px; }
.detail-body h2 { font-size: 22px; margin-bottom: 12px; }

.detail-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--gray-500);
}

.detail-meta span { display: flex; align-items: center; gap: 8px; }

.detail-desc {
  font-size: 15px;
  line-height: 1.6;
  color: var(--gray-700);
  margin-bottom: 16px;
}

.detail-contact-box {
  background: var(--primary-bg);
  border-radius: 10px;
  padding: 16px;
}

.detail-contact-box h4 { font-size: 14px; color: var(--primary); margin-bottom: 8px; }
.detail-contact-box p { font-size: 15px; font-weight: 600; color: var(--gray-900); }

.detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.btn-resolved {
  flex: 1;
  padding: 12px;
  background: var(--success);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-delete {
  padding: 12px 20px;
  background: white;
  color: var(--danger);
  border: 1.5px solid #fecaca;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

.btn-resolved:hover { opacity: .9; }
.btn-delete:hover { background: #fef2f2; }

.resolved-banner {
  background: var(--success-bg);
  color: var(--success);
  text-align: center;
  padding: 8px;
  font-weight: 600;
  font-size: 14px;
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--gray-900);
  color: white;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  opacity: 0;
  transition: all .3s;
  z-index: 300;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 640px) {
  .card-grid { grid-template-columns: 1fr; }
  .header-stats { display: none; }
  .logo { font-size: 18px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      Lost &amp; Found
      <span style="font-size:12px;font-weight:400;opacity:.75;margin-left:4px">made by 9A siyu</span>
    </div>
    <div class="header-stats">
      <span>📋 <strong id="totalCount">0</strong> Posts</span>
      <span>🔴 <strong id="lostCount">0</strong> Lost</span>
      <span>🟢 <strong id="foundCount">0</strong> Found</span>
    </div>
  </div>
  <nav>
    <button class="active" data-filter="all">All</button>
    <button data-filter="lost">Lost Items</button>
    <button data-filter="found">Found Items</button>
    <button data-filter="resolved">Resolved</button>
  </nav>
</header>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by item name, location, description...">
  </div>

  <div class="filter-tags">
    <span class="filter-tag active" data-cat="all">All Categories</span>
    <span class="filter-tag" data-cat="Cards">🪪 Cards</span>
    <span class="filter-tag" data-cat="Books & Stationery">📚 Books & Stationery</span>
    <span class="filter-tag" data-cat="PE Kit">🏃 PE Kit</span>
    <span class="filter-tag" data-cat="Other">📦 Other</span>
  </div>

  <div id="cardGrid" class="card-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="icon">📭</div>
    <h3>No posts yet</h3>
    <p>Click the + button to report a lost or found item</p>
  </div>
</div>

<button class="fab" onclick="openPostModal()" title="New Post">＋</button>

<!-- Post Modal -->
<div class="modal-overlay" id="postModal">
  <div class="modal">
    <div class="modal-header">
      <h2>New Post</h2>
      <button class="modal-close" onclick="closePostModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="type-selector">
        <button class="type-btn active-lost" id="typeLost" onclick="setType('lost')">🔴 I Lost Something</button>
        <button class="type-btn" id="typeFound" onclick="setType('found')">🟢 I Found Something</button>
      </div>
      <form id="postForm" onsubmit="submitPost(event)">
        <div class="form-group">
          <label>Item Name <span class="required">*</span></label>
          <input type="text" id="itemName" required placeholder="">
        </div>
        <div class="form-group">
          <label>Category <span class="required">*</span></label>
          <select id="itemCategory" required>
            <option value="">Select a category</option>
            <option value="Cards">🪪 Cards</option>
            <option value="Books & Stationery">📚 Books & Stationery</option>
            <option value="PE Kit">🏃 PE Kit</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label><span id="locationLabel">Where did you lose it?</span> <span class="required">*</span></label>
          <input type="text" id="itemLocation" required placeholder="">
        </div>
        <div class="form-group">
          <label><span id="timeLabel">When did you lose it?</span> <span class="required">*</span></label>
          <input type="datetime-local" id="itemTime" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="itemDesc" placeholder="Describe the item's appearance and features to help others identify it..."></textarea>
        </div>
        <div class="form-group">
          <label>Upload Photo</label>
          <div class="image-upload" id="imageUpload" onclick="document.getElementById('imageInput').click()">
            <div class="icon">📷</div>
            <p>Click to upload a photo of the item</p>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)">
          </div>
        </div>
        <div class="form-group">
          <label>Contact Info <span class="required">*</span></label>
          <input type="text" id="itemContact" required placeholder="School email">
        </div>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="posterName" placeholder="Your name (optional)">
        </div>
        <button type="submit" class="btn-submit">Submit Post</button>
      </form>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay detail-modal" id="detailModal">
  <div class="modal">
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBErGm8CqmXvY_HdvodatQpUy5UUrUaAss",
  authDomain: "myp-service.firebaseapp.com",
  databaseURL: "https://myp-service-default-rtdb.firebaseio.com",
  projectId: "myp-service",
  storageBucket: "myp-service.firebasestorage.app",
  messagingSenderId: "191618763725",
  appId: "1:191618763725:web:89f95dbcc3fa5e9eb41284"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const itemsRef = db.ref('items');

let items = [];
let currentType = 'lost';
let currentFilter = 'all';
let currentCategory = 'all';
let imageData = null;

// Listen for real-time updates from Firebase
itemsRef.on('value', snapshot => {
  const data = snapshot.val();
  if (data) {
    items = Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] }));
    items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  } else {
    items = [];
  }
  renderCards();
  updateStats();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function updateStats() {
  const active = items.filter(i => !i.resolved);
  document.getElementById('totalCount').textContent = items.length;
  document.getElementById('lostCount').textContent = active.filter(i => i.type === 'lost').length;
  document.getElementById('foundCount').textContent = active.filter(i => i.type === 'found').length;
}

function getFilteredItems() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  return items.filter(item => {
    if (currentFilter === 'lost' && item.type !== 'lost') return false;
    if (currentFilter === 'found' && item.type !== 'found') return false;
    if (currentFilter === 'resolved' && !item.resolved) return false;
    if (currentFilter !== 'resolved' && item.resolved) return false;
    if (currentCategory !== 'all' && item.category !== currentCategory) return false;
    if (search) {
      const text = `${item.name} ${item.location} ${item.desc || ''} ${item.category} ${item.poster || ''}`.toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
  return new Date(dateStr).toLocaleDateString('en-US');
}

function formatTime(dateStr) {
  return new Date(dateStr).toLocaleString('en-US', {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const filtered = getFilteredItems();

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map(item => `
    <div class="card" onclick="showDetail('${item.firebaseKey}')">
      ${item.image
        ? `<div class="card-image"><img src="${item.image}" alt="${escHtml(item.name)}"></div>`
        : `<div class="card-image">${item.type === 'lost' ? '🔍' : '📦'}</div>`
      }
      <div class="card-body">
        <div class="card-header">
          <span class="card-title">${escHtml(item.name)}</span>
          <span class="card-badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">
            ${item.type === 'lost' ? 'Lost' : 'Found'}
          </span>
        </div>
        <div class="card-info">
          <span>📍 ${escHtml(item.location)}</span>
          <span>🕐 ${formatTime(item.time)}</span>
          <span>📅 Posted ${timeAgo(item.createdAt)}</span>
        </div>
        <span class="card-category">${escHtml(item.category)}</span>
        ${item.resolved ? '<div style="margin-top:8px;color:#059669;font-weight:600;font-size:13px">✅ Resolved</div>' : ''}
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function showDetail(key) {
  const item = items.find(i => i.firebaseKey === key);
  if (!item) return;

  const c = document.getElementById('detailContent');
  c.innerHTML = `
    ${item.resolved ? '<div class="resolved-banner">✅ This item has been resolved</div>' : ''}
    ${item.image ? `<img class="detail-image" src="${item.image}" alt="">` : ''}
    <div class="detail-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span class="card-badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}" style="font-size:13px">
          ${item.type === 'lost' ? '🔴 Lost Item' : '🟢 Found Item'}
        </span>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <h2>${escHtml(item.name)}</h2>
      <div class="detail-meta">
        <span>📍 ${item.type === 'lost' ? 'Lost at' : 'Found at'}: ${escHtml(item.location)}</span>
        <span>🕐 ${item.type === 'lost' ? 'Lost on' : 'Found on'}: ${formatTime(item.time)}</span>
        <span>📂 Category: ${escHtml(item.category)}</span>
        ${item.poster ? `<span>👤 Posted by: ${escHtml(item.poster)}</span>` : ''}
        <span>📅 Posted ${timeAgo(item.createdAt)}</span>
      </div>
      ${item.desc ? `<div class="detail-desc">${escHtml(item.desc)}</div>` : ''}
      <div class="detail-contact-box">
        <h4>📞 Contact Information</h4>
        <p>${escHtml(item.contact)}</p>
      </div>
      ${!item.resolved ? `
        <div class="detail-actions">
          <button class="btn-resolved" onclick="resolveItem('${item.firebaseKey}')">✅ Mark as Resolved</button>
          <button class="btn-delete" onclick="deleteItem('${item.firebaseKey}')">Delete</button>
        </div>
      ` : `
        <div class="detail-actions">
          <button class="btn-delete" onclick="deleteItem('${item.firebaseKey}')">Delete Post</button>
        </div>
      `}
    </div>
  `;

  document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
}

function resolveItem(key) {
  db.ref('items/' + key).update({ resolved: true }).then(() => {
    showDetail(key);
    showToast('Marked as resolved!');
  });
}

function deleteItem(key) {
  if (!confirm('Are you sure you want to delete this post?')) return;
  db.ref('items/' + key).remove().then(() => {
    closeDetailModal();
    showToast('Post deleted');
  });
}

function openPostModal() {
  document.getElementById('postModal').classList.add('show');
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('itemTime').value = now.toISOString().slice(0, 16);
}

function closePostModal() {
  document.getElementById('postModal').classList.remove('show');
  document.getElementById('postForm').reset();
  imageData = null;
  const upload = document.getElementById('imageUpload');
  upload.innerHTML = '<div class="icon">📷</div><p>Click to upload a photo of the item</p><input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)">';
}

function setType(type) {
  currentType = type;
  document.getElementById('typeLost').className = `type-btn ${type === 'lost' ? 'active-lost' : ''}`;
  document.getElementById('typeFound').className = `type-btn ${type === 'found' ? 'active-found' : ''}`;
  document.getElementById('locationLabel').textContent = type === 'lost' ? 'Where did you lose it?' : 'Where did you find it?';
  document.getElementById('timeLabel').textContent = type === 'lost' ? 'When did you lose it?' : 'When did you find it?';
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    showToast('Image must be under 2MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev) {
    imageData = ev.target.result;
    const upload = document.getElementById('imageUpload');
    upload.innerHTML = `<img class="image-preview" src="${imageData}"><input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)">`;
  };
  reader.readAsDataURL(file);
}

function submitPost(e) {
  e.preventDefault();
  const item = {
    type: currentType,
    name: document.getElementById('itemName').value.trim(),
    category: document.getElementById('itemCategory').value,
    location: document.getElementById('itemLocation').value.trim(),
    time: document.getElementById('itemTime').value,
    desc: document.getElementById('itemDesc').value.trim(),
    contact: document.getElementById('itemContact').value.trim(),
    poster: document.getElementById('posterName').value.trim(),
    image: imageData || '',
    createdAt: new Date().toISOString(),
    resolved: false
  };

  itemsRef.push(item).then(() => {
    closePostModal();
    showToast('Post submitted successfully!');
  }).catch(err => {
    showToast('Error: ' + err.message);
  });
}

// Nav filter
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });
});

// Category filter
document.querySelectorAll('.filter-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    currentCategory = tag.dataset.cat;
    renderCards();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', renderCards);

// Close modals on overlay click
document.getElementById('postModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePostModal();
});
document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDetailModal();
});
</script>
</body>
</html>
